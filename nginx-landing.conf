# www.edgesecura.dev — public marketing landing.
# Static dist served from /var/www/landing. Wildcard cert covers
# www.edgesecura.dev. Apex (edgesecura.dev) needs its own cert if you
# want to serve there too — wildcard `*.edgesecura.dev` does NOT cover
# the bare apex.

server {
    listen 80;
    listen [::]:80;
    server_name www.edgesecura.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.edgesecura.dev;

    ssl_certificate /etc/letsencrypt/live/edgesecura.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edgesecura.dev/privkey.pem;

    root /var/www/landing;
    index index.html;
    try_files $uri $uri.html $uri/ =404;

    location ~* "^/(_astro|assets)/" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
